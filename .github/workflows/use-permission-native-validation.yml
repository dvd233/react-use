name: usePermission native baseline and candidate validation

on:
  push:
    branches:
      - validation/use-permission-cleanup-20261007

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.repository_id == '1407991245' && github.repository_owner_id == '111864431' && github.ref == 'refs/heads/validation/use-permission-cleanup-20261007' }}
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - name: Check out the separately reviewed validation harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: validation
          persist-credentials: false

      - name: Set up the upstream CI Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}

      - name: Require immutable verified source bindings
        id: bindings
        run: >-
          node validation/.github/validation/use-permission-validate.cjs
          check-bindings
          validation/.github/validation/use-permission-bindings.json

      - name: Set up the repository-recorded Yarn Classic version
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          test "$(yarn --version)" = "1.22.22"

      - name: Check out the unchanged upstream baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: streamich/react-use
          ref: fbe99c6327e6af94df03bc8bd6ecc5e3ff04fbcc
          path: baseline
          persist-credentials: false

      - name: Check out the verified two-file source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.bindings.outputs.source_repository }}
          ref: ${{ steps.bindings.outputs.source_commit }}
          path: candidate
          persist-credentials: false

      - name: Run original-lock native checks and exact regression controls
        env:
          EXPECTED_NODE_MAJOR: ${{ matrix.node }}
          RUN_QUALITY_CHECKS: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 20 }}
          VALIDATION_OUTPUT: ${{ runner.temp }}/use-permission-validation
        run: >-
          node validation/.github/validation/use-permission-validate.cjs
          run
          validation/.github/validation/use-permission-bindings.json
          baseline
          candidate

      - name: Preserve logs and machine-readable outcomes even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: use-permission-${{ matrix.os }}-node${{ matrix.node }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/use-permission-validation
          if-no-files-found: error
          retention-days: 14
